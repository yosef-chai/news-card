name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/news_card/manifest.json)
          CARD=$(grep -oP 'CARD_VERSION = "\K[^"]+' custom_components/news_card/frontend/news-card.js)
          echo "tag=$TAG manifest=$MANIFEST card=$CARD"
          test "$TAG" = "$MANIFEST" && test "$TAG" = "$CARD"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
