name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  validate:
    uses: ./.github/workflows/validate.yml

  # HACS דורש שהגרסה תיווצר רק אחרי שהבדיקות עברו
  release:
    needs: [tests, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/news_card/manifest.json)
          CARD=$(grep -oP 'CARD_VERSION = "\K[^"]+' custom_components/news_card/frontend/news-card.js)
          echo "tag=$TAG manifest=$MANIFEST card=$CARD"
          test "$TAG" = "$MANIFEST" && test "$TAG" = "$CARD"
      # ישות העדכון של ה-Marketplace מציגה את גוף הגרסה; הוא נלקח מגוף הודעת ה-commit של התג
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%b HEAD > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --notes-file notes.md --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
