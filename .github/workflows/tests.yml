name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components.news_card --cov-report=term-missing --cov-fail-under=95
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/news_card/frontend/news-card.js
