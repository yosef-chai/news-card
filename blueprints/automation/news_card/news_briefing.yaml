blueprint:
  name: News Card - daily news briefing
  description: >-
    At the time you choose, collects the latest headlines from your News Card
    feeds and sends them to your phone, reads them aloud, or both. It can mark
    the headlines as read afterwards.
  domain: automation
  author: yosef-chai
  source_url: https://github.com/yosef-chai/news-card/blob/main/blueprints/automation/news_card/news_briefing.yaml
  homeassistant:
    min_version: 2026.8.0
  input:
    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      input:
        time:
          name: Time
          default: "07:30:00"
          selector:
            time:
        weekdays:
          name: Days
          default: [sun, mon, tue, wed, thu, fri, sat]
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Sunday
                  value: sun
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
    content:
      name: Headlines
      icon: mdi:newspaper-variant-multiple
      input:
        feeds:
          name: News feeds
          description: Any entity of each feed, for example its "Latest article" sensor.
          selector:
            entity:
              multiple: true
              filter:
                - integration: news_card
                  domain: sensor
        count:
          name: Number of headlines
          default: 5
          selector:
            number:
              min: 1
              max: 20
              mode: box
        hours:
          name: From the last
          description: Only articles published within this many hours.
          default: 12
          selector:
            number:
              min: 1
              max: 72
              unit_of_measurement: h
              mode: box
        mark_read:
          name: Mark the headlines as read
          default: false
          selector:
            boolean:
    delivery:
      name: Delivery
      icon: mdi:send
      description: Choose a phone, speakers, or both.
      input:
        title:
          name: Title
          default: News briefing
          selector:
            text:
        notify_device:
          name: Phone
          default: ""
          selector:
            device:
              filter:
                - integration: mobile_app
        tts_entity:
          name: Text-to-speech engine
          default: ""
          selector:
            entity:
              filter:
                - domain: tts
        speakers:
          name: Speakers
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

mode: single

triggers:
  - trigger: time
    at: !input time

conditions:
  - condition: time
    weekday: !input weekdays

variables:
  feeds: !input feeds
  count: !input count
  hours: !input hours
  title: !input title
  notify_device: !input notify_device
  tts_entity: !input tts_entity
  speakers: !input speakers
  mark_read: !input mark_read

actions:
  - action: news_card.get_entries
    data:
      entity_id: "{{ feeds }}"
      since: "{{ (now() - timedelta(hours=hours | int)).isoformat() }}"
    response_variable: news
  - variables:
      articles: >-
        {% set ns = namespace(items=[]) %}
        {% for feed in news.values() %}{% set ns.items = ns.items + feed.entries %}{% endfor %}
        {{ (ns.items | sort(attribute='published', reverse=true))[: count | int] }}
  - condition: template
    value_template: "{{ articles | count > 0 }}"
  - if:
      - condition: template
        value_template: "{{ notify_device != '' }}"
    then:
      # השירות של האפליקציה נקרא לפי שם הטלפון; פעולת מכשיר לא מאפשרת להשאיר את הטלפון ריק
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          title: "{{ title }}"
          message: >-
            {% for a in articles %}• {{ a.title }}{{ (' (' ~ a.source ~ ')') if a.source }}{{ '\n' if not loop.last }}{% endfor %}
          data:
            group: news_card
            tag: news_card_briefing
  - if:
      - condition: template
        value_template: "{{ tts_entity != '' and speakers | count > 0 }}"
    then:
      - action: tts.speak
        target:
          entity_id: "{{ tts_entity }}"
        data:
          media_player_entity_id: "{{ speakers }}"
          cache: false
          message: "{{ title }}. {{ articles | map(attribute='title') | join('. ') }}"
  - if:
      - condition: template
        value_template: "{{ mark_read }}"
    then:
      - action: news_card.mark_read
        data:
          entity_id: "{{ feeds }}"
          article_id: "{{ articles | map(attribute='id') | list }}"
