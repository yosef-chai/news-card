blueprint:
  name: News Card - read new headlines aloud
  description: >-
    Reads the headline of every new article from the chosen News Card feeds on
    your speakers, only during the hours you choose. Type keywords to hear only
    articles that mention them.
  domain: automation
  author: yosef-chai
  source_url: https://github.com/yosef-chai/news-card/blob/main/blueprints/automation/news_card/speak_new_article.yaml
  homeassistant:
    min_version: 2026.8.0
  input:
    feeds:
      name: News feeds
      description: The feeds to watch (their devices or "New article" event entities).
      selector:
        target:
          entity:
            - integration: news_card
              domain: event
    keywords:
      name: Keywords
      description: Only read articles whose title or summary contains one of these words. Leave empty for every new article.
      default: []
      selector:
        text:
          multiple: true
    speech:
      name: Speech
      icon: mdi:account-voice
      input:
        tts_entity:
          name: Text-to-speech engine
          description: Choose an engine that speaks the language of your feeds.
          selector:
            entity:
              filter:
                - domain: tts
        speakers:
          name: Speakers
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        prefix:
          name: Opening words
          description: Said before the headline, for example "Breaking news".
          default: ""
          selector:
            text:
        include_summary:
          name: Also read the summary
          default: false
          selector:
            boolean:
    quiet_hours:
      name: When to speak
      icon: mdi:clock-outline
      input:
        start_time:
          name: From
          default: "08:00:00"
          selector:
            time:
        end_time:
          name: Until
          default: "22:00:00"
          selector:
            time:

mode: queued
max: 10

triggers:
  - trigger: news_card.new_article
    target: !input feeds
    options:
      keywords: !input keywords

conditions:
  - condition: time
    after: !input start_time
    before: !input end_time

variables:
  prefix: !input prefix
  include_summary: !input include_summary
  article: "{{ trigger.to_state.attributes }}"

actions:
  - action: tts.speak
    target:
      entity_id: !input tts_entity
    data:
      media_player_entity_id: !input speakers
      cache: false
      message: >-
        {{ (prefix ~ '. ') if prefix }}{{ article.title }}
        {%- if include_summary and article.summary %}. {{ article.summary | truncate(300) }}{% endif %}
