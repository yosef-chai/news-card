rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Default 15 minutes, user adjustable from 5 to 1440; conditional GET (ETag / Last-Modified).
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only use the coordinator; no extra subscriptions.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: unique_id is the normalized feed URL.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Feeds are public; there are no credentials.
  test-coverage: done

  # Gold
  devices:
    status: done
    comment: One service device per feed.
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Feeds are web addresses and cannot be discovered on the network.
  discovery:
    status: exempt
    comment: Feeds are web addresses and cannot be discovered on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment: Supported feed formats are documented.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is exactly one feed device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All three sensors and the event entity are useful by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: The device is removed with its config entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: Downloads are async (aiohttp); feedparser only parses bytes, in the executor.
  inject-websession: done
  strict-typing: todo
