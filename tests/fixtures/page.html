	<script id="ad-manager-host-runtime">
(function(w,d){
	var PHP_PRO=false;
	var PHP_LOGGED=false;
	var AJAX_URL="https:\/\/www.jdn.co.il\/wp-admin\/admin-ajax.php?action=ad_manager_host_pro_status";

	function hasWpLogin(){
		try{return d.cookie.indexOf('wordpress_logged_in')!==-1;}catch(e){return false;}
	}

	function cacheSaysPro(){
		try{if(d.cookie.indexOf('ad_manager_pro=1')!==-1)return true;}catch(e){}
		try{if(w.localStorage&&w.localStorage.getItem('ad_manager_pro')==='1')return true;}catch(e){}
		return false;
	}

	function isSponsoredType(t){
		t=(t||'').toLowerCase();
		return t==='sponsored'||t==='article_list'||t==='article_dedicated';
	}

	function shouldLoadSlot(containerId){
		if(!w.__amPro)return true;
		var el=d.getElementById(containerId);
		if(!el)return false;
		return isSponsoredType(el.getAttribute('data-tool-type'));
	}

	function purgeStandardSlots(){
		var slots=d.querySelectorAll('.ad-manager-slot[id^="ad-manager-"]');
		for(var i=0;i<slots.length;i++){
			var tt=(slots[i].getAttribute('data-tool-type')||'').toLowerCase();
			if(!isSponsoredType(tt)){
				slots[i].innerHTML='';
				slots[i].removeAttribute('data-am-loaded');
			}
		}
	}

	function filterQueue(){
		w._adManager=w._adManager||{q:[]};
		if(w._adManager.q&&w._adManager.q.length){
			w._adManager.q=w._adManager.q.filter(function(id){return shouldLoadSlot(id);});
		}
	}

	/* החלת מצב פרו — מסתיר באנרים רגילים */
	function applyProState(){
		w.__amPro=true;
		w.adManagerData=w.adManagerData||{};
		w.adManagerData.isProSubscriber=true;
		w.__adManagerBlockBannerFetch=false;
		try{w.localStorage.setItem('ad_manager_pro','1');}catch(e){}
		if(d.documentElement){d.documentElement.classList.add('ad-manager-pro-user');}
		if(d.body){d.body.classList.add('ad-manager-pro-user');}
		filterQueue();
		purgeStandardSlots();
	}

	/* ביטול מצב פרו — מנקה מטמון ישן (הורדה מפרימיום / התנתקות) */
	function clearProState(){
		var was=w.__amPro;
		w.__amPro=false;
		w.adManagerData=w.adManagerData||{};
		w.adManagerData.isProSubscriber=false;
		try{w.localStorage.removeItem('ad_manager_pro');}catch(e){}
		try{d.cookie='ad_manager_pro=;path=/;max-age=0';}catch(e){}
		if(d.documentElement){d.documentElement.classList.remove('ad-manager-pro-user');}
		if(d.body){d.body.classList.remove('ad-manager-pro-user');}
		/* אם הסתרנו באנרים אופטימית — נטען אותם מחדש */
		if(was&&w.AdManager&&typeof w.AdManager.scheduleBannerBootstrap==='function'){
			w.AdManager.scheduleBannerBootstrap();
		}
	}

	function installFetchBlock(){
		var origFetch=w.fetch;
		if(typeof origFetch!=='function')return;
		w.fetch=function(input){
			var url=typeof input==='string'?input:(input&&input.url?String(input.url):'');
			if(w.__adManagerBlockBannerFetch&&url&&url.indexOf('/wp-json/ad-manager/v1/banner/')!==-1){
				return Promise.resolve(new Response('{"success":true,"banners":[]}',{status:200,headers:{'Content-Type':'application/json'}}));
			}
			return origFetch.apply(this,arguments);
		};
	}

	w.__amPro=false;
	w.__adManagerIsProViewer=function(){return !!w.__amPro;};
	w.__adManagerShouldLoadSlot=shouldLoadSlot;

	if(PHP_PRO){
		/* השרת אישר פרו — סמכותי */
		applyProState();
		return;
	}
	if(PHP_LOGGED){
		/* השרת אומר מחובר אך לא פרו — סמכותי; מנקים מטמון ישן ומציגים באנרים */
		clearProState();
		return;
	}
	/* PHP חושב שלא מחובר — ייתכן דף ממוטמן שהוגש לגולש מחובר */
	if(hasWpLogin()){
		/* גולש מחובר בדף ממוטמן — חייבים אימות מהשרת (סמכותי) */
		if(cacheSaysPro()){
			applyProState(); /* אופטימי: מונע הבזק באנרים לפרו עד אימות */
		}else{
			w.__adManagerBlockBannerFetch=true;
			installFetchBlock();
		}
		fetch(AJAX_URL,{credentials:'same-origin',cache:'no-store'})
			.then(function(r){return r.json();})
			.then(function(data){
				w.__adManagerBlockBannerFetch=false;
				if(data&&data.pro){applyProState();}
				else{clearProState();}
			})
			.catch(function(){w.__adManagerBlockBannerFetch=false;});
	}else{
		/* גולש אנונימי — לא פרו; מנקים מטמון ישן אם נשאר */
		if(cacheSaysPro()){clearProState();}
	}
})(window,document);
</script>

}
